name: Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-test-matrix:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [18.x, 20.x, 22.x]

    steps:
    - uses: actions/checkout@v3

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build
      run: npm run build

    - name: Type check
      run: npm run typecheck

    - name: Lint
      run: npm run lint

    - name: Run tests
      run: npm run test

    - name: Upload test coverage
      uses: codecov/codecov-action@v3
      if: matrix.os == 'ubuntu-latest' && matrix.node-version == '18.x'
      with:
        file: ./coverage/coverage-final.json
        flags: unittests

  # Separate job for coverage threshold (optional)
  coverage-threshold:
    runs-on: ubuntu-latest
    needs: build-test-matrix
    if: github.event_name == 'pull_request'
    steps:
    - uses: actions/checkout@v3

    - name: Use Node.js 18.x
      uses: actions/setup-node@v3
      with:
        node-version: 18.x
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run tests with coverage
      run: npm run test:coverage

    - name: Check coverage threshold
      run: |
        # Extract coverage percentage from summary
        # This is a simple check; consider using a dedicated coverage tool
        COVERAGE=$(node -e "const fs = require('fs'); const cov = JSON.parse(fs.readFileSync('./coverage/coverage-summary.json', 'utf8')); console.log(cov.total.statements.pct);")
        THRESHOLD=10
        if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l) )); then
          echo "Coverage ($COVERAGE%) is below threshold ($THRESHOLD%)"
          exit 1
        else
          echo "Coverage ($COVERAGE%) meets threshold ($THRESHOLD%)"
        fi